name: discord-release

# One Discord post per release, after the release workflow finishes on a v* tag
# (the tag is the run's head_branch). Not on release: published: the release is
# created with GITHUB_TOKEN, and GitHub starts no workflow from that token.
# A re-run does not post again if an earlier attempt of the same run succeeded
# (the script checks); a re-run after a failed attempt does post.
# Run it by hand with a tag to re-post. Tick "Skip the Claude summary" to post
# the raw CHANGELOG section instead. With the secret DISCORD_RELEASE_WEBHOOK_URL
# set, every release post also goes to that channel (one summary, two posts, each
# independent; the release channel's one opens with @everyone). Tick "Post only to
# the release channel" to re-post there alone.

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to post
        required: true
        type: string
      no_summary:
        description: Skip the Claude summary and post the raw CHANGELOG section
        required: false
        default: false
        type: boolean
      only_release_channel:
        description: Post only to the release channel (a re-post that must not repeat in the main one)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # to read the earlier attempts of the release run
  actions: read

jobs:
  notify:
    if: >-
      github.repository == 'DadsMmoLab/dads-mmo-lab' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the Anthropic SDK
        run: pip install anthropic==1.12.1
      - name: Post the release to Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ inputs.no_summary != true && secrets.ANTHROPIC_API_KEY || '' }}
          DISCORD_RELEASE_THREAD_ID: ${{ vars.DISCORD_RELEASE_THREAD_ID }}
          # optional second channel: the same post, also sent there
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_RELEASE_CHANNEL_THREAD_ID: ${{ vars.DISCORD_RELEASE_CHANNEL_THREAD_ID }}
          RELEASE_ONLY_CHANNEL: ${{ inputs.only_release_channel == true && 'true' || '' }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: python .github/scripts/discord_notify.py release
