name: release

# pyplan/README.md §4 + roadmap 5.3: a `v*` tag builds all three artifacts on
# their own runners (PyInstaller cannot cross-compile). Linux output is wrapped
# in an AppImage (the "hero artifact"); Windows ships the one-dir build zipped;
# macOS ships a .dmg of the .app. Artifacts are attached to the GitHub Release
# for the tag, which is what `yulon.update` points users at.

on:
  push:
    tags:
      - "v*"
  # So the matrix can be PROVEN without publishing anything: a manual run builds
  # all three artifacts and uploads them to the run; only a v* tag attaches them
  # to a GitHub Release (roadmap Phase 5 exit criteria).
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: pylauncher

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: AppImage
          - os: windows-latest
            artifact: exe
          - os: macos-latest
            artifact: dmg
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt pyinstaller

      # PYINSTALLER BUNDLES WHAT IT FINDS ON THE BUILDER, so a library missing
      # from the runner is a library missing from the artifact. Qt 6.5+ needs
      # libxcb-cursor0 to load its `xcb` platform plugin, ubuntu-latest does not
      # ship it, and the v0.6.5 AppImage therefore dumped core on every X11
      # desktop with:
      #
      #   qt.qpa.plugin: From 6.5.0, xcb-cursor0 or libxcb-cursor0 is needed to
      #   load the Qt xcb platform plugin ... This application failed to start
      #
      # Ubuntu's own desktop defaults to Wayland, which is why it went unnoticed.
      # Measured 2026-08-24: same commit, 6 bundled libxcb* on the runner vs 14
      # on a machine that had the package - i.e. the artifact was not
      # reproducible either.
      - name: Qt runtime libraries the bundle must carry
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxcb-cursor0

      - name: Build with PyInstaller
        run: pyinstaller build/pylauncher.spec --noconfirm --clean

      # ---------------------------------------------------------- Linux
      - name: Package AppImage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2
          APPDIR=AppDir
          rm -rf "$APPDIR" && mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r dist/yulon/. "$APPDIR/usr/bin/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/yulon" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/yulon.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Yu'lon
          Comment=Dad's MMO Lab launcher
          Exec=yulon
          Icon=yulon
          Categories=Game;Utility;
          Terminal=false
          EOF
          cp "$APPDIR/yulon.desktop" "$APPDIR/usr/share/applications/"
          # Placeholder icon until the project has artwork (any 256x256 PNG works).
          python3 - <<'EOF'
          import struct, zlib
          w = h = 256
          raw = b"".join(b"\x00" + b"\x2b\x6c\xb5\xff" * w for _ in range(h))
          def chunk(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("AppDir/yulon.png", "wb").write(png)
          EOF
          cp "$APPDIR/yulon.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/yulon.png"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool "$APPDIR" "Yulon-${GITHUB_REF_NAME}-x86_64.AppImage"
          mkdir -p release && mv Yulon-*.AppImage release/

          # A PLAIN TARBALL BESIDE THE APPIMAGE, because an AppImage cannot run
          # without FUSE and there is no packaging trick that removes that.
          #
          # A statically linked runtime was tried first and does NOT fix it,
          # measured on a clean Arch box 2026-08-25: static linking removes the
          # libfuse LIBRARY dependency, but mounting still shells out to the
          # `fusermount3` setuid helper, so the artifact died exactly as before
          # with "No suitable fusermount binary found on the $PATH". Arch ships
          # neither fuse2 nor fuse3 by default; Fedora is fine only because it
          # ships fuse3, which is luck rather than a contract.
          #
          # So the honest answer is a second artifact rather than a cleverer
          # first one: untar it and run ./yulon.
          tar -czf "release/Yulon-${GITHUB_REF_NAME}-x86_64.tar.gz" -C dist yulon

      # -------------------------------------------------------- Windows
      - name: Package Windows zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/yulon/* -DestinationPath "release/Yulon-$env:GITHUB_REF_NAME-windows-x64.zip"

      # ---------------------------------------------------------- macOS
      - name: Package dmg
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release dmgroot
          cp -R dist/Yulon.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Yu'lon" -srcfolder dmgroot -ov -format UDZO "release/Yulon-${GITHUB_REF_NAME}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: yulon-${{ matrix.artifact }}
          path: pylauncher/release/*

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pylauncher/release/*
          generate_release_notes: true
