name: release

# pyplan/README.md §4 + roadmap 5.3: a `v*` tag builds all three artifacts on
# their own runners (PyInstaller cannot cross-compile). Linux output is wrapped
# in an AppImage (the "hero artifact"); Windows ships the one-dir build zipped;
# macOS ships a .dmg of the .app. Artifacts are attached to the GitHub Release
# for the tag, which is what `yulon.update` points users at.

on:
  push:
    tags:
      - "v*"
  # So the matrix can be PROVEN without publishing anything: a manual run builds
  # all three artifacts and uploads them to the run; only a v* tag attaches them
  # to a GitHub Release (roadmap Phase 5 exit criteria).
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: pylauncher

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOT ubuntu-latest. A glibc binary runs forward but never
          # backward, so the builder's glibc is the artifact's FLOOR. Measured
          # on a real Ubuntu 22.04.5 box: the v0.6.51 tarball, built on 24.04,
          # dies with "libm.so.6: version `GLIBC_2.38' not found" before drawing
          # anything - i.e. it cannot run on the most widely deployed LTS, nor
          # on Debian 12 or RHEL 9. Building on the OLDEST supported runner is
          # what makes the artifact portable; moving this to a newer image
          # silently drops every distro below it.
          #
          # THIS LABEL HAS A DATED EXPIRY. actions/runner-images#14254: the
          # ubuntu-22.04 images begin deprecation 2026-09-17 and are fully
          # unsupported 2027-04-17, with brownouts (jobs failed on purpose) on
          # 23 and 30 March and 6 and 13 April 2027. Every replacement GitHub
          # offers - ubuntu-24.04, ubuntu-26.04, ubuntu-latest - reintroduces
          # the exact defect above, because none of them is glibc 2.35.
          #
          # So the replacement is not another runner label - it is to stop
          # depending on the runner's OS at all. Do NOT reach for a job-level
          # `container: ubuntu:22.04` when that day comes: the stock image has
          # no `sudo` (every `sudo apt-get` below breaks), appimagetool is
          # itself an AppImage and needs `--appimage-extract-and-run` because
          # containers have no FUSE, and the closure gate's own `docker run`
          # would need a socket mount and a docker CLI the image does not ship.
          #
          # What works instead is to scope the container to the ONE step whose
          # glibc matters, leaving checkout, setup-python, packaging and the
          # gate on the host runner:
          #
          #   docker run --rm -v "$PWD:/work" -w /work ubuntu:22.04 \
          #     bash -c "apt-get update && apt-get install -y python3-pip &&
          #              pip install -r requirements.txt pyinstaller &&
          #              pyinstaller build/pylauncher.spec --noconfirm --clean"
          #
          # That pins the floor to an image this repo chooses rather than one
          # GitHub retires, and touches nothing else in the job.
          - os: ubuntu-22.04
            artifact: AppImage
          - os: windows-latest
            artifact: exe
          - os: macos-latest
            artifact: dmg
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # GITHUB_REF_NAME is the TAG on a release run and the BRANCH on a manual
      # one, and it goes straight into the artifact filename. Every branch here
      # is `fix/...`, `ci/...`, `feat/...`, so on workflow_dispatch that name
      # carries a path separator and packaging writes into a directory that does
      # not exist. Measured on all three runners: the build succeeded and then
      # "Could not create destination file", "hdiutil: create failed", "the path
      # ...\\release\\Yulon-ci ... does not exist". The dispatch trigger exists so
      # the matrix can be proven without publishing, and it could not produce a
      # single artifact.
      #
      # A no-op on a v* tag - tags carry no slash - so released filenames are
      # byte-identical to the ones already published.
      - name: Name the artifacts after a ref that can be a filename
        shell: bash
        run: |
          # Loud rather than empty. GitHub's bash wrapper runs with -eo pipefail
          # but NOT -u, so an unset ref would expand to nothing and quietly
          # publish "Yulon--x86_64.AppImage". Unreachable under the two triggers
          # this workflow has today; the guard is for the third one somebody
          # adds later.
          : "${GITHUB_REF_NAME:?the runner set no ref name - refusing to name artifacts after nothing}"
          echo "YULON_REF=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt pyinstaller

      # T90: the bundle carries the tag it was built from, so a forgotten bump of
      # `yulon/__init__.py` cannot make the update check compare the wrong
      # version - v0.8.68 shipped reporting 0.8.66. The stamp is a gitignored
      # `yulon/_build_version.py` that `yulon.__init__` prefers over its
      # hand-written fallback, and `collect_submodules("yulon")` in the spec is
      # what carries it into the bundle. It must therefore be written BEFORE
      # PyInstaller reads the package. A dispatch build of a branch writes
      # nothing and keeps the fallback. Never fails.
      - name: Stamp the version from the tag
        shell: bash
        run: python build/stamp_version.py "${GITHUB_REF_NAME}"

      # PYINSTALLER BUNDLES WHAT IT FINDS ON THE BUILDER, so a library missing
      # from the runner is a library missing from the artifact. Qt 6.5+ needs
      # libxcb-cursor0 to load its `xcb` platform plugin, the runner does not
      # ship it, and the v0.6.5 AppImage therefore dumped core on every X11
      # desktop with:
      #
      #   qt.qpa.plugin: From 6.5.0, xcb-cursor0 or libxcb-cursor0 is needed to
      #   load the Qt xcb platform plugin ... This application failed to start
      #
      # Ubuntu's own desktop defaults to Wayland, which is why it went unnoticed.
      # Measured 2026-08-24: same commit, 6 bundled libxcb* on the runner vs 14
      # on a machine that had the package - i.e. the artifact was not
      # reproducible either.
      #
      # libxkbcommon-x11-0 is the same trap one library over, and the shipped
      # v0.6.51 artifact still had it: on a clean Arch box the tarball aborts
      # with the message above, which names xcb-cursor0 and is a RED HERRING.
      # Qt prints that line whenever the xcb plugin fails to load, whatever the
      # reason. QT_DEBUG_PLUGINS=1 gives the real one:
      #
      #   Cannot load library .../libqxcb.so:
      #   libxkbcommon-x11.so.0: cannot open shared object file
      #
      # The bundle carries libxkbcommon.so.0 and NOT libxkbcommon-x11.so.0 -
      # different libraries. Measured 2026-08-25: the CI artifact has one, a
      # build of the same tree on a machine with the package has both. Fedora
      # hid it because GNOME pulls the package in; Arch does not.
      - name: Qt runtime libraries the bundle must carry
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          # The four libxcb-* here were found by the bundle-closure check below,
          # not by a user - they were the same defect as libxkbcommon-x11 and had
          # simply not been hit yet, because Arch's Xfce happens to ship them.
          # libqxcb.so needs all five, and any desktop missing one gets the same
          # abort with the same misleading "xcb-cursor0" message.
          sudo apt-get install -y -qq \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxcb-xkb1 \
            libxcb-glx0

      - name: Build with PyInstaller
        run: pyinstaller build/pylauncher.spec --noconfirm --clean

      # WHAT THE BUILD SHIPS, written into the bundle so the app can read it
      # back on the machine it is installed on (T90 plan 3). The self-update
      # replaces the install's top-level ENTRIES rather than its folder -- the
      # folder may be the player's Downloads folder -- and it will only replace
      # a name this file lists, so a `thesis.docx` beside the executable is
      # never moved. Written after PyInstaller and before every packaging step,
      # so all three artifacts carry it.
      #
      # `dist/yulon` only: the macOS job's `.app` is never swapped in place and
      # the step would have nothing to list there.
      - name: Record the top-level names this build ships
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          out="dist/yulon/_internal/yulon-shipped.txt"
          : > "$out"
          for entry in dist/yulon/*; do
            basename "$entry" >> "$out"
          done
          cat "$out"

      # ASK THE BUILT BUNDLE, on every runner. v0.8.69-fixtest was cut with the
      # stamp step already in this job: all three builds logged "stamped
      # 0.8.69-fixtest", every job was green, and the published app reported
      # 0.8.66-Public - the stamp module had not reached the bundle
      # (`collect_submodules` returns nothing here; see build/pylauncher.spec).
      # Nothing in the workflow could see that, because nothing ever asked the
      # artifact what it thought it was.
      #
      # It cannot fail the release: `continue-on-error`, a `--version` that is
      # allowed to come back empty, and a `::warning::` rather than an exit
      # code, because the owner's rule is that a tag never fails over its
      # version. A warning is visible on the run and in the annotations list.
      - name: The built bundle reports the version it was stamped with
        continue-on-error: true
        # A HANG HERE WOULD COST THE TAG ITS ARTIFACTS. This step is the first
        # thing in the workflow that ever RUNS the bundle, and on Windows it is
        # a windowed exe: an unhandled exception in one of those is reported in
        # a modal message box, which nothing on a headless runner will ever
        # close. Left alone it would sit until GitHub's six-hour job limit, and
        # a cancelled job never reaches "Attach to the GitHub Release" - so the
        # release would lose the artifacts it was building. `continue-on-error`
        # does not save that: it forgives a failure the step returns, not a
        # step that never returns. Hence a bound on the step as well as on the
        # call below.
        timeout-minutes: 3
        shell: bash
        run: |
          set -uo pipefail
          exe="dist/yulon/yulon"
          [ "$RUNNER_OS" = "Windows" ] && exe="dist/yulon/yulon.exe"
          # `--version` is answered before PySide6 is imported, so this needs no
          # display and no Qt libraries on the runner.
          #
          # NOT `timeout(1)`: that is coreutils, and the macOS runner does not
          # ship it - the step would die with "timeout: command not found" on
          # one of the three platforms this has to work on. kill, sleep and
          # `$!` are in every one of their shells.
          #
          # The kill takes the whole TREE, not just the process that was
          # started. Measured locally against a stand-in that spawns a child:
          # killing the parent alone left the child running, and a frozen
          # bundle is exactly the case where there is something under it. `ps
          # -o pid=,ppid=` and `awk` are on all three runners; `pkill -P`,
          # `setsid` and a negative-PID group kill are not.
          kill_tree() {
            local parent="$1" child
            for child in $(ps -o pid=,ppid= 2>/dev/null | awk -v p="$parent" '$2 == p {print $1}'); do
              kill_tree "$child"
            done
            kill -9 "$parent" 2>/dev/null || true
          }
          answer="${RUNNER_TEMP}/version.txt"
          : > "$answer"
          "$exe" --version > "$answer" 2>/dev/null &
          asked=$!
          waited=0
          while kill -0 "$asked" 2>/dev/null && [ "$waited" -lt 120 ]; do
            sleep 1
            waited=$((waited + 1))
          done
          if kill -0 "$asked" 2>/dev/null; then
            kill_tree "$asked"
            echo "::warning title=The built bundle did not answer in time::${exe} --version was still running after ${waited}s and was killed; a windowed build reports a crash in a modal box no runner can close"
          fi
          wait "$asked" 2>/dev/null || true
          # `tr -d '\r'` on BOTH sides. On Windows the bundle and python both
          # end their lines CRLF, `$(...)` strips the LF and leaves the CR, and
          # a lone "\r" is not empty - so a dispatch build of a branch compared
          # a real version against "\r" and warned that the stamp had not
          # reached the bundle. Tag builds only passed because both sides
          # carried the same stray byte.
          built="$(tr -d '\r' < "$answer" | tail -1)"
          expected="$(python build/stamp_version.py --derive "${GITHUB_REF_NAME}" 2>/dev/null | tr -d '\r' || true)"
          if [ -z "$built" ]; then
            # Its own case rather than a mismatch, because one plausible cause is
            # not a stamp problem at all: the Windows build is a windowed exe,
            # and whether it writes to a redirected pipe is a fact about the
            # runner that this step is the first thing here to measure.
            echo "::warning title=The built bundle did not answer --version::${exe} printed nothing; the release is published anyway"
          elif [ -z "$expected" ]; then
            echo "branch build: the bundle reports '${built}', and there is no tag to compare it with"
          elif [ "$built" = "$expected" ]; then
            echo "the bundle reports ${built}, which is the tag it was built from"
          else
            echo "::warning title=The bundle does not know its own version::built='${built}' tag='${expected}' - the stamp did not reach the bundle; the release is published anyway"
          fi

      # The gate that closes this class instead of the instance.
      #
      # Two libraries have shipped missing and been found by USERS: libxcb-cursor0
      # (#96) and libxkbcommon-x11 (v0.6.51, which aborted on launch on Arch).
      # Neither could have been caught here by running the app, because THIS
      # RUNNER HAS THOSE LIBRARIES - testing the artifact on the machine that
      # built it is blind to exactly this defect. So the check resolves the
      # bundle's own objects inside a container that has nothing, and fails on
      # anything the artifact silently expects the user to provide.
      #
      # Verified against the real history before being added (2026-08-25): it
      # fails on the shipped v0.6.51 tarball naming all five missing sonames,
      # and passes on a build that carries them.
      - name: The bundle must carry the libraries it needs
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: bash build/check-bundle-closure.sh dist

      # ---------------------------------------------------------- Linux
      - name: Package AppImage
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2
          APPDIR=AppDir
          rm -rf "$APPDIR" && mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r dist/yulon/. "$APPDIR/usr/bin/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/yulon" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/yulon.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Yu'lon
          Comment=Dad's MMO Lab launcher
          Exec=yulon
          Icon=yulon
          Categories=Game;Utility;
          Terminal=false
          EOF
          cp "$APPDIR/yulon.desktop" "$APPDIR/usr/share/applications/"
          # Placeholder icon until the project has artwork (any 256x256 PNG works).
          python3 - <<'EOF'
          import struct, zlib
          w = h = 256
          raw = b"".join(b"\x00" + b"\x2b\x6c\xb5\xff" * w for _ in range(h))
          def chunk(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("AppDir/yulon.png", "wb").write(png)
          EOF
          cp "$APPDIR/yulon.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/yulon.png"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool "$APPDIR" "Yulon-${YULON_REF}-x86_64.AppImage"
          mkdir -p release && mv Yulon-*.AppImage release/

          # A PLAIN TARBALL BESIDE THE APPIMAGE, because an AppImage mounts
          # itself with FUSE and the two routes that would move that off the
          # user's machine both cost more than a second file.
          #
          # ROUTE 1, a statically linked runtime. Tried, and it does NOT fix it,
          # measured on a clean Arch box 2026-08-25: static linking removes the
          # libfuse LIBRARY dependency, but mounting still shells out to the
          # `fusermount3` setuid helper, so the artifact died exactly as before
          # with "No suitable fusermount binary found on the $PATH". Arch ships
          # neither fuse2 nor fuse3 by default; Fedora is fine only because it
          # ships fuse3, which is luck rather than a contract.
          #
          # ROUTE 2, a runtime that falls back to extract-and-run. Read up
          # 2026-09-04, because the obvious next idea is "surely newer
          # appimagetool does this now". It does not: `--appimage-extract-and-run`
          # and APPIMAGE_EXTRACT_AND_RUN are both read on the RUNNING machine, so
          # neither can be baked in here, and the runtime appimagetool embeds
          # fails rather than falling back. A third-party runtime that does fall
          # back exists (VHSgunzo/uruntime, MIT, x86_64 + aarch64, fed in with
          # `--runtime-file`), and its fallback is `URUNTIME_EXTRACT=2` — an
          # environment variable on the user's machine again. The price is a
          # non-upstream binary in the one path that publishes, bought for a
          # switch the stuck user still has to set. Not taken.
          #
          # Still true on 2026-09-04: the release AppImage sha256 `cb7c1b7e75…`
          # was refused on `yulon-arch` before the interpreter existed, and the
          # same file with `--appimage-extract-and-run` started and reached the
          # update check — `.notes/gates/7.1-arch/71-arch-appimage.log`.
          #
          # So the honest answer is a second artifact rather than a cleverer
          # first one: untar it and run ./yulon. `pylauncher/README.md` tells the
          # user which file to take and why, and
          # `tests/test_linux_artifact_prereqs.py` fails if this line goes away
          # and leaves that page promising a file nothing builds.
          tar -czf "release/Yulon-${YULON_REF}-x86_64.tar.gz" -C dist yulon

      # -------------------------------------------------------- Windows
      - name: Package Windows zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/yulon/* -DestinationPath "release/Yulon-$env:YULON_REF-windows-x64.zip"

      # ---------------------------------------------------------- macOS
      - name: Package dmg
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release dmgroot
          cp -R dist/Yulon.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Yu'lon" -srcfolder dmgroot -ov -format UDZO "release/Yulon-${YULON_REF}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: yulon-${{ matrix.artifact }}
          path: pylauncher/release/*

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pylauncher/release/*
          # Stays as the FALLBACK. `notes-and-checksums` below replaces this
          # body with the CHANGELOG entries the tag gained, and only when it
          # found any; a release whose changelog says nothing new keeps
          # GitHub's generated list rather than an empty page.
          generate_release_notes: true

  # T90: ONE job for what belongs to the release as a whole. Each build job
  # attaches its own artifact and cannot see the other two, so none of them can
  # checksum the others, and none of them can own the body either - three
  # concurrent writers of one release body is how it ends up being whichever
  # runner finished last.
  #
  # `!cancelled()` rather than the default `success()`: fail-fast is off, so a
  # release with two good artifacts still gets their checksums. The app refuses
  # to self-install an artifact `SHA256SUMS` does not list, which is the whole
  # point of publishing it, and a missing third line is honest.
  #
  # NOT gated on the tag as a whole (only the two attach steps are), so that a
  # `workflow_dispatch` run proves this job the same way it proves the matrix -
  # without publishing anything. `SHA256SUMS` then lands as a run artifact.
  notes-and-checksums:
    needs: build
    if: ${{ !cancelled() }}
    # EVERYTHING HERE IS ADDITIVE, so nothing here may turn a release that is
    # already published red. The three build jobs have attached the artifacts
    # by the time this starts; what this job adds is a checksum file and a
    # better body. A directory in the release folder, or a transient GitHub API
    # error in either attach step, would otherwise mark a finished release as
    # failed and send whoever cut it looking for a broken build.
    #
    # It fails safe on the other side too: the app refuses to self-install an
    # artifact `SHA256SUMS` does not list, so a release that did not get one
    # offers the download page instead of installing something unproven. The
    # step logs still show what went wrong, and the run is marked with it.
    continue-on-error: true
    # ubuntu-latest, unlike the build matrix: nothing here is compiled or
    # bundled, so the glibc floor the `build` job pins 22.04 for does not apply,
    # and this job does not inherit that label's dated expiry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release_notes.py reads CHANGELOG.md at the previous -Public tag with
          # `git show`; the default shallow clone has neither that tag nor that
          # blob, and the script would degrade to "no notes" on every release.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          # THE BUILD ARTIFACTS ONLY. `download-artifact` sees every artifact of
          # the RUN, and this job uploads one of its own - so on "Re-run failed
          # jobs" an unfiltered download drops the first attempt's SHA256SUMS
          # back into the release folder, and the new file lists the old file
          # under the hash it had before: a checksum line for a name no release
          # carries. The upload below is deliberately named so that this
          # pattern cannot match it, and the test pins that relationship in
          # both directions - including that this pattern still matches all
          # three `yulon-${{ matrix.artifact }}` names above.
          pattern: yulon-*
          # An action's inputs are never subject to `defaults.run`, so this path
          # is from the repository root; the `run:` steps below are in
          # `pylauncher/` and see the same directory as `release/`.
          path: pylauncher/release
          merge-multiple: true

      - name: SHA256SUMS over every artifact this release carries
        id: sums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cd release
          ls -l
          # The second stop for the re-run trap above, in case a future edit
          # loosens the download pattern: whatever is here under this name is
          # this job's own previous answer, never an artifact of the release.
          rm -f SHA256SUMS
          # REGULAR FILES ONLY, and never the file being written. `sha256sum`
          # exits 1 on a directory, and under `set -e` that would fail a job
          # whose whole output is optional. `-printf '%f\n'` keeps the bare
          # names the format needs (a name with a newline in it would break
          # this, and would break `sha256sum`'s own format as well; no artifact
          # this workflow builds has one). `LC_ALL=C sort` so the file reads the
          # same whatever the runner's locale is, and `-r` so an empty list runs
          # nothing rather than leaving `sha256sum` reading stdin.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | LC_ALL=C sort > ../artifacts.txt
          # All three builds failed, or the folder holds nothing but
          # directories: a checksum file with no lines would read as "this
          # release lists no artifact" rather than as "there is nothing here".
          if [ ! -s ../artifacts.txt ]; then
            echo "no artifact was built: nothing to checksum"
            rm -f ../artifacts.txt
            exit 0
          fi
          # Written OUTSIDE the directory and moved in, so the list cannot
          # include the file being written half-made.
          xargs -d '\n' -r sha256sum -- < ../artifacts.txt > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          rm -f ../artifacts.txt
          cat SHA256SUMS
          echo "have=true" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          python build/release_notes.py --tag "${GITHUB_REF_NAME}" --out "${RUNNER_TEMP}/notes.md"
          if [ -s "${RUNNER_TEMP}/notes.md" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; fi

      - name: Keep SHA256SUMS where a dispatch run can be read
        if: steps.sums.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          # NOT `yulon-...`: that is the prefix the download pattern above
          # matches, and this job must never be able to download its own
          # answer on a re-run.
          name: checksums-SHA256SUMS
          # A re-run of this job finds the first attempt's artifact still in the
          # run, and `upload-artifact@v4` refuses a name the run already holds
          # unless it is told to replace it.
          overwrite: true
          path: pylauncher/release/SHA256SUMS

      - name: Attach SHA256SUMS and the changelog body
        if: startsWith(github.ref, 'refs/tags/v') && steps.sums.outputs.have == 'true' && steps.notes.outputs.have == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: pylauncher/release/SHA256SUMS
          body_path: ${{ runner.temp }}/notes.md

      - name: Attach SHA256SUMS (the changelog gained nothing; generated notes stay)
        if: startsWith(github.ref, 'refs/tags/v') && steps.sums.outputs.have == 'true' && steps.notes.outputs.have != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: pylauncher/release/SHA256SUMS
