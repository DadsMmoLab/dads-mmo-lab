name: ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: pylauncher

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PySide6's Qt libraries need these even for QT_QPA_PLATFORM=offscreen (the UI tests).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - run: pip install -r requirements-dev.txt

      - name: ruff (lint)
        run: python -m ruff check .

      - name: black (format check)
        run: python -m black --check .

      - name: mypy (types)
        run: python -m mypy yulon main.py

      - name: pytest (tests)
        run: python -m pytest -q
