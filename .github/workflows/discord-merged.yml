name: discord-merged

# One Discord post per commit pushed to Yulon (a squash merge is one commit, so
# one PR is one post): title, link, author and a short Claude Haiku summary.
# A commit with no PR (a direct push) is posted as its first line and a link.
# More than 10 commits, or a force push, is one compact message instead.
# Not on pull_request: closed as well, or every merge would post twice.

on:
  push:
    branches: [Yulon]

permissions:
  contents: read
  pull-requests: read

# No concurrency group on purpose: a group keeps one pending run and replaces
# it, so a third push in a row would silently drop a merge's post.

jobs:
  notify:
    if: github.repository == 'DadsMmoLab/dads-mmo-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the Anthropic SDK
        run: pip install anthropic==1.12.1
      - name: Post merged PRs to Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_PR_THREAD_ID: ${{ vars.DISCORD_PR_THREAD_ID }}
        run: python .github/scripts/discord_notify.py merged
