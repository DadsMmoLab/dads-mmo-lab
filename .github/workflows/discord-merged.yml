name: discord

# All the Discord notifications live in this one file. GitHub never registered
# separate discord-release / discord-issues workflow files in this repository,
# but it registered this path, so the three jobs sit here (job `merged`, `issue`
# and `release`), each started by its own event.
#
# merged   (push to Yulon) One post per commit (a squash merge is one commit, so
#          one PR is one post): title, link, author and a short Claude Haiku
#          summary. A commit with no PR (a direct push) is posted as its first
#          line and a link. More than 10 commits, or a force push, is one compact
#          message instead. Not on pull_request: closed as well, or every merge
#          would post twice.
# issue    (issues opened / closed / reopened) One post per issue. Every run reads
#          the issue as it is NOW and renders that, so whichever run executes last
#          shows the true state. No trusted message id yet: post it (one short
#          Claude Haiku summary) and store the id in a comment by
#          github-actions[bot] (never the issue body, which anyone can edit). Id
#          found: edit that message only; Claude is not called again.
# release  (workflow_run of `release`, or by hand) One post per release, after the
#          release workflow finishes on a v* tag (the tag is the run's
#          head_branch). Not on release: published: the release is created with
#          GITHUB_TOKEN, and GitHub starts no workflow from that token. A re-run
#          does not post again if an earlier attempt of the same run succeeded
#          (the script checks); a re-run after a failed attempt does post. Run it
#          by hand with a tag to re-post. Tick "Skip the Claude summary" to post
#          the raw CHANGELOG section instead. With the secret
#          DISCORD_RELEASE_WEBHOOK_URL set, every release post also goes to that
#          channel (one summary, two posts, each independent; the release
#          channel's one opens with @everyone). Tick "Post only to the release
#          channel" to re-post there alone.

on:
  push:
    branches: [Yulon]
  issues:
    types: [opened, closed, reopened]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to post
        required: true
        type: string
      no_summary:
        description: Skip the Claude summary and post the raw CHANGELOG section
        required: false
        default: false
        type: boolean
      only_release_channel:
        description: Post only to the release channel (a re-post that must not repeat in the main one)
        required: false
        default: false
        type: boolean

# The union of what the three jobs need.
permissions:
  contents: read
  pull-requests: read
  issues: write
  # to read the earlier attempts of the release run
  actions: read

# No workflow-level concurrency group, and none on the `merged` job on purpose: a
# group keeps one pending run and replaces it, so a third push in a row would
# silently drop a merge's post.

jobs:
  merged:
    if: >-
      github.repository == 'DadsMmoLab/dads-mmo-lab' && (
      github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the Anthropic SDK
        run: pip install anthropic==1.12.1
      - name: Post merged PRs to Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_PR_THREAD_ID: ${{ vars.DISCORD_PR_THREAD_ID }}
        run: python .github/scripts/discord_notify.py merged

  issue:
    if: >-
      github.repository == 'DadsMmoLab/dads-mmo-lab' && (
      github.event_name == 'issues')
    # One run at a time per issue. A queue keeps one pending run and replaces it,
    # which is fine because each run renders the current state.
    concurrency:
      group: discord-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the Anthropic SDK
        run: pip install anthropic==1.12.1
      - name: Sync the issue with Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_ISSUE_THREAD_ID: ${{ vars.DISCORD_ISSUE_THREAD_ID }}
        run: python .github/scripts/discord_notify.py issue

  release:
    if: >-
      github.repository == 'DadsMmoLab/dads-mmo-lab' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the Anthropic SDK
        run: pip install anthropic==1.12.1
      - name: Post the release to Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ inputs.no_summary != true && secrets.ANTHROPIC_API_KEY || '' }}
          DISCORD_RELEASE_THREAD_ID: ${{ vars.DISCORD_RELEASE_THREAD_ID }}
          # optional second channel: the same post, also sent there
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_RELEASE_CHANNEL_THREAD_ID: ${{ vars.DISCORD_RELEASE_CHANNEL_THREAD_ID }}
          RELEASE_ONLY_CHANNEL: ${{ inputs.only_release_channel == true && 'true' || '' }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: python .github/scripts/discord_notify.py release
