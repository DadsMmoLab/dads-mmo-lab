name: discord-issues

# One Discord post per issue. Every run reads the issue as it is NOW and renders
# that, so whichever run executes last shows the true state. No trusted message
# id yet: post it (one short Claude Haiku summary) and store the id in a comment
# by github-actions[bot] (never the issue body, which anyone can edit). Id found:
# edit that message only; Claude is not called again.

on:
  issues:
    types: [opened, closed, reopened]

permissions:
  contents: read
  issues: write

# One run at a time per issue. A queue keeps one pending run and replaces it,
# which is fine because each run renders the current state.
concurrency:
  group: discord-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.repository == 'DadsMmoLab/dads-mmo-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the Anthropic SDK
        run: pip install anthropic==1.12.1
      - name: Sync the issue with Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_ISSUE_THREAD_ID: ${{ vars.DISCORD_ISSUE_THREAD_ID }}
        run: python .github/scripts/discord_notify.py issue
