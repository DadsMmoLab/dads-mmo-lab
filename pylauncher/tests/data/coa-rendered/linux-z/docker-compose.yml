# generated by Yu'lon — do not hand-edit; the install engine rewrites this file.
#
# WoW Conquest of Azeroth (AzerothCore CoA fork + SquidBots playerbots) for the native install engine
# (roadmap 6.2). THREE FILES, and the split is the point:
#
#   * docker-compose.yml       (this file) name:, services, container names,
#     image refs, ALL ports, binds, volumes, depends_on, healthchecks.
#   * docker-compose.override.yml   runtime AC_* env and the ./modules mount,
#     nothing structural — it is auto-loaded AND rewritten by whatever settings
#     surface comes next, and a YAML writer keeps only what it understands.
#   * docker-compose.build.yml      build:/target: only, never auto-loaded, so
#     a post-install `up` can never start a multi-hour rebuild.
#
# PROVENANCE — read this before changing a line. The shape below is the Rust
# launcher's `native-compose.yml.tmpl` (`git show origin/rust-main:crates/
# dml-wow/data/native-compose.yml.tmpl`), which was itself copied from a
# WORKING migrated server rather than invented, reconciled against this repo's
# own Linux installer override and against `pyplan/rust-prior-art.md` §2.
#
# IT HAS SINCE BEEN DIFFED, and this line used to say it had not. On 2026-08-24
# `docker compose config` on the proven yulon-ubuntu install was compared with
# what this template renders: every service, container name, port, `depends_on`
# edge and healthcheck matched, and the one real difference — the Linux
# script's playerbot bot counts, missing here — now ships as data in
# `catalog.json`'s `install.native.azerothcore.world_env`. What that proves is
# that the file RESOLVES, not that it builds or starts or serves a client; the
# gate items in `pyplan/phase6-decisions.md` that cover those are still open.
#
# THE IMAGE TAG IS WRITTEN IN, NOT INTERPOLATED. Every other host-visible
# value here is spelled `${VAR:-default}` because something WRITES that
# variable: the port-conflict remedy appends `DOCKER_DB_EXTERNAL_PORT=13306`
# to `.env`, a SOAP setup writes the whole SOAP binding. Nothing writes
# `IMAGE_TAG` — `composegen.py` substitutes `native-d4199c73` at generation time
# and no code path puts that key in `.env`. The wrapper it used to carry was
# therefore indirection with no writer and exactly one effect: a hand-edited
# `.env` would retag the build while `built_image_refs()` kept asking the
# daemon about the derived default, so `images_built()` would answer "not
# built" forever and every resume would re-run a multi-hour compile — the same
# defect that was just measured and fixed from the other direction. Five
# reviewers refused to leave that documented in a test and called for it to be
# closed; this is the close (2026-08-24).
#
# CONTAINER NAMES ARE A CONTRACT, and they are deliberately the same `ac-*`
# names every Linux install in the wild carries: the console attach, the repair
# button, the backup `docker exec ac-database mysqldump` and every archived
# guide address them by name. The per-install separation lives in `name:`
# instead, which is also what keys the named volumes.
# BIND_LABEL: the SELinux relabel suffix, on every ./ host bind below and on no named volume.
name: yulon-wow-coa-d4199c73

services:
  coa-database:
    container_name: coa-database
    image: mysql:8.4
    networks: [ac-network]
    ports:
      # Loopback ONLY. Nothing off this machine has business reaching MySQL,
      # and the launcher's own maintenance path talks to it through
      # `docker exec`, not over the network. The variable name is a contract
      # with the port-conflict remedy, which appends
      # DOCKER_DB_EXTERNAL_PORT=13306 to .env when 3306 is taken.
      - "127.0.0.1:${DOCKER_DB_EXTERNAL_PORT:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Yu'lon .env is missing}
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    # THE DATABASE OUTLIVES THE WORLDSERVER ON EVERY STOP PATH (T98). The
    # app's Stop is `compose stop`, which stops the worldserver first and this
    # service last. A Docker DAEMON shutdown -- a PC shutdown, a Docker Desktop
    # quit, `systemctl stop docker` -- does not read depends_on: it signals
    # every container at once, and the database was measured gone in under 2 s
    # (yulon-ubuntu, 2026-09-23) while the worldserver was still draining the
    # 7400-7700 character saves it queues at shutdown (docker.STOP_GRACE_SECONDS).
    #
    # So SIGTERM is held here while any server container is still connected
    # (a TCP client from off loopback), then passed on to mysqld. The app's
    # own `docker exec` queries name no host and ride the socket, so they do
    # not count. The healthcheck below DOES: it connects over TCP to
    # `ac-database`, this container's own network address, so for the few
    # milliseconds it is connected it reads as a server and can add one
    # more second to the hold. The hold is bounded at
    # 240 s: the app's stops all pass `-t 300`, which overrides
    # stop_grace_period, and 60 s is left for mysqld's own shutdown (measured
    # 1.4 s). A count that fails is logged to stderr (the client's words; the
    # password is in MYSQL_PWD, never in argv or the log) and tried again a
    # second later: one fault must not end the hold under a connected world,
    # but five in a row stop the database rather than hold it to the grace's
    # SIGKILL. The grace is the worldserver's 5m so a daemon shutdown never
    # SIGKILLs the database mid-wait. tests/test_db_outlives_world.py runs this script.
    # `$$` is compose's escape for a literal `$`.
    stop_grace_period: 5m
    entrypoint:
      - bash
      - -c
      - |
        db=
        held=
        hold() {
          [ -n "$$held" ] && return
          held=1
          i=0
          failed=0
          err=/tmp/yulon-hold-$$$$.err
          while [ $$i -lt 240 ]; do
            if left=$$(MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -N -B -e "SELECT COUNT(*) FROM information_schema.PROCESSLIST WHERE ID <> CONNECTION_ID() AND HOST LIKE '%:%' AND HOST NOT LIKE '127.%' AND HOST NOT LIKE '::1%' AND HOST NOT LIKE '[::1]%'" 2>"$$err"); then
              failed=0
              [ "$${left:-0}" = 0 ] && break
              echo "yulon: holding shutdown, $$left server connection(s) still open"
            else
              failed=$$((failed + 1))
              echo "yulon: could not count server connections ($$failed of 5 in a row): $$(tr '\n' ' ' < "$$err")" >&2
              [ $$failed -ge 5 ] && break
            fi
            sleep 1
            i=$$((i + 1))
          done
          kill -TERM "$$db" 2>/dev/null
        }
        trap hold TERM INT
        docker-entrypoint.sh "$$@" &
        db=$$!
        [ -n "$$held" ] && kill -TERM "$$db"
        while kill -0 "$$db" 2>/dev/null; do wait "$$db"; done
        wait "$$db"
      - yulon-db
    command: ["mysqld"]
    healthcheck:
      # Probes the way a CONSUMER does: over TCP, addressed by service name,
      # from the compose network. Upstream's copy has no `-h` at all, so it
      # rides the unix socket and "healthy" means only "a local client can log
      # in" — while `ac-db-import`, both servers and the maintenance path all
      # reach the database over TCP as `ac-database:3306`.
      #
      # The first version of this fix used `-h 127.0.0.1`, which an adversarial
      # review (Codex, 2026-08-24) correctly called out as still the wrong
      # interface: loopback inside the container is not the interface consumers
      # arrive on, so the probe did not establish what the comment claimed. It
      # is true that MySQL's default bind is `*`, which makes the two ready at
      # the same instant — but "the claim happens to hold" is not the same as
      # "the probe proves it", and this one now proves it.
      #
      # This is NOT a reproduced fix. The install of 2026-08-24 died with
      # `Can't connect to MySQL server on 'ac-database:3306' (111)` 0.3 s after
      # compose called the database healthy, and the socket/TCP split was the
      # inferred cause. It did NOT reproduce: 10 fresh-volume runs on
      # yulon-ubuntu — 5 with upstream's spelling, 5 with `-h 127.0.0.1
      # --protocol=TCP`, `depends_on: service_healthy`, and a second container
      # connecting to `ac-database:3306` — all connected first try.
      #
      # READ THAT COUNT CAREFULLY: those 10 runs predate this line. They tested
      # `-h 127.0.0.1`, which is what shipped before the review above. The
      # spelling now here was verified separately and once — a probe project
      # with this exact `test:`, `depends_on: service_healthy`, and a second
      # container that connected on the first try. So the timing claim below
      # (healthy in the same 17.1-18.2 s as upstream's) is measured of the
      # loopback spelling, and inherited by this one on the argument that
      # neither changes when the server starts listening, not on a rerun.
      # Corrected after a doc-truth sweep found this comment claiming the 10
      # runs used "this exact healthcheck" when they used the older one.
      # See `pyplan/checklist.md`.
      #
      # ONE COUPLING, WORTH KNOWING BEFORE YOU HARDEN THIS SERVICE. Root over
      # TCP works only because the official image's entrypoint defaults
      # `MYSQL_ROOT_HOST` to `%` and so creates `root@%` — verified on a fresh
      # volume, 2026-08-24: `SELECT CURRENT_USER()` over TCP returns `root@%`,
      # and the entrypoint's own guard is `[ -n "$MYSQL_ROOT_HOST" ] && [
      # "$MYSQL_ROOT_HOST" != 'localhost' ]`. A review seat predicted this
      # probe could NEVER authenticate for want of that variable; the evidence
      # refuted it. But the refutation names the tripwire: adding
      # `MYSQL_ROOT_HOST: localhost` here — a plausible hardening — deletes
      # `root@%`, and this healthcheck then never passes, so every waiter hangs
      # on a database that is running and fine.
      # The password rides MYSQL_PWD, never `--password=` (T748): a container's
      # processes are in the host's `ps`, and argv is readable by every local user.
      test: "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" /usr/bin/mysql -h coa-database --protocol=TCP --user=root --execute \"SHOW DATABASES;\""
      interval: 5s
      timeout: 10s
      retries: 40

  coa-db-import:
    container_name: coa-db-import
    image: yulon.local/ac-coa-db-import:native-d4199c73
    networks: [ac-network]
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "coa-database;3306;root;${DB_ROOT_PASSWORD:?Yu'lon .env is missing};acore_auth"
      AC_WORLD_DATABASE_INFO: "coa-database;3306;root;${DB_ROOT_PASSWORD:?Yu'lon .env is missing};acore_world"
      AC_CHARACTER_DATABASE_INFO: "coa-database;3306;root;${DB_ROOT_PASSWORD:?Yu'lon .env is missing};acore_characters"
      # The playerbots schema. Its absence is the gap this file was written to
      # close: the one-shot creates only the databases it is told about, and an
      # import that never heard of acore_playerbots leaves a worldserver that
      # cannot start its bots.
      AC_PLAYERBOTS_DATABASE_INFO: "coa-database;3306;root;${DB_ROOT_PASSWORD:?Yu'lon .env is missing};acore_playerbots"
      # WHICH modules' SQL this import may apply, and it is not the ones in the
      # folder next to this file. Upstream's default is "all", and "all" means
      # AC_MODULES_LIST - a macro modules/CMakeLists.txt:371 bakes from a glob
      # at CMake time - so a module cloned after the image was compiled is
      # invisible to the importer for ever. Proven twice on yulon-ubuntu
      # 2026-09-07 against the same files and the same database: the unchanged
      # one-shot logged "Loading modules: all" and applied nothing
      # (acore_world.updates stayed at 2967); the same container with
      # AC_UPDATES_ALLOWED_MODULES=mod-aoe-loot logged ">> Applying update
      # aoe_loot_module_string.sql" and left it at 2968.
      #
      # Interpolated, not baked: what is on disk changes every time a module is
      # installed, and this file is written once at install time.
      # `docker.allowed_modules()` computes the list; a value in this project's
      # .env reaches an `up` (compose reads .env from the project directory),
      # and `docker.apply_module_sql()` passes it in argv for the installs
      # whose compose file this engine did not write.
      #
      # The default is "all" and MUST NOT be empty. src/tools/dbimport/Main.cpp
      # :114-118 branches three ways and an empty value is the third: it builds
      # a DatabaseLoader with no module list at all. Measured on the real image
      # 2026-09-07 - `-e AC_UPDATES_ALLOWED_MODULES=` logs "Loading modules:
      # none". So an unset variable renders exactly upstream's own behaviour,
      # and no install changes what it does by acquiring this line.
      AC_UPDATES_ALLOWED_MODULES: "${AC_UPDATES_ALLOWED_MODULES:-all}"
    # user: left to the image (acore) - see composegen.container_user()
    volumes:
      - ./env/dist/etc:/azerothcore/env/dist/etc:z
      - ./env/dist/logs:/azerothcore/env/dist/logs:z
      # The modules tree, because the import applies every module's own
      # data/sql/db-auth and db-characters updates as well as AzerothCore's.
      - ./modules:/azerothcore/modules:z
    depends_on:
      coa-database:
        condition: service_healthy

  coa-authserver:
    container_name: coa-authserver
    image: yulon.local/ac-coa-authserver:native-d4199c73
    networks: [ac-network]
    tty: true
    restart: unless-stopped
    environment:
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_TEMP_DIR: "/azerothcore/env/dist/temp"
      AC_LOGIN_DATABASE_INFO: "coa-database;3306;root;${DB_ROOT_PASSWORD:?Yu'lon .env is missing};acore_auth"
    # user: left to the image (acore) - see composegen.container_user()
    volumes:
      - ./env/dist/etc:/azerothcore/env/dist/etc:z
      - ./env/dist/logs:/azerothcore/env/dist/logs:z
    ports:
      # The game client connects to this from the LAN, so it is deliberately
      # NOT loopback-pinned (unlike the DB and SOAP admin ports).
      - "${DOCKER_AUTH_EXTERNAL_PORT:-3726}:3724"
    depends_on:
      coa-database:
        condition: service_healthy
      coa-db-import:
        condition: service_completed_successfully

  coa-worldserver:
    container_name: coa-worldserver
    image: yulon.local/ac-coa-worldserver:native-d4199c73
    networks: [ac-network]
    # stdin + tty keep the worldserver CONSOLE attachable: the Console tab
    # drives it with `docker attach --sig-proxy=false`, and losing either turns
    # that into a silent hang (confirmed independently by this project on
    # 2026-08-21 — `docker attach` refuses a non-TTY stdin).
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Measured, not inherited: three shutdowns of a populated playerbots realm
    # on yulon-ubuntu (2026-08-23) took 90.7s, 73.4s and 58.3s, almost all of
    # it draining 7400-7700 queued character saves. Compose's 10s default
    # SIGKILLs that mid-save; see docker.STOP_GRACE_SECONDS, which is the same
    # 300 seconds spelled for the CLI stop path.
    stop_grace_period: 5m
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "coa-database;3306;root;${DB_ROOT_PASSWORD:?Yu'lon .env is missing};acore_auth"
      AC_WORLD_DATABASE_INFO: "coa-database;3306;root;${DB_ROOT_PASSWORD:?Yu'lon .env is missing};acore_world"
      AC_CHARACTER_DATABASE_INFO: "coa-database;3306;root;${DB_ROOT_PASSWORD:?Yu'lon .env is missing};acore_characters"
      AC_PLAYERBOTS_DATABASE_INFO: "coa-database;3306;root;${DB_ROOT_PASSWORD:?Yu'lon .env is missing};acore_playerbots"
      # Runtime settings live in docker-compose.override.yml.
    ports:
      - "${DOCKER_WORLD_EXTERNAL_PORT:-8087}:8085"
      # SOAP is pinned to loopback by the DEFAULT VALUE, never by an IP prefix
      # on the mapping: a later SOAP setup writes the WHOLE host binding into
      # .env as DOCKER_SOAP_EXTERNAL_PORT=127.0.0.1:7878, and a literal prefix
      # here would render 127.0.0.1:127.0.0.1:7878:7878. Compose also
      # CONCATENATES ports: across files — never add a second entry for this
      # port anywhere else.
      - "${DOCKER_SOAP_EXTERNAL_PORT:-127.0.0.1:7880}:7878"
    # user: left to the image (acore) - see composegen.container_user()
    volumes:
      # env/dist/etc must be bound out to the host: it is where the module
      # system reads and writes worldserver.conf and every module conf.
      - ./env/dist/etc:/azerothcore/env/dist/etc:z
      - ./env/dist/logs:/azerothcore/env/dist/logs:z
      - ./data:/azerothcore/env/dist/data:ro:z
      # The ./modules source mount lives in docker-compose.override.yml.
    depends_on:
      coa-database:
        condition: service_healthy
      coa-db-import:
        condition: service_completed_successfully

  coa-tools:
    container_name: coa-tools
    image: yulon.local/ac-coa-tools:native-d4199c73
    networks: [ac-network]
    command: ["true"]
    restart: "no"

  coa-world-bootstrap:
    container_name: coa-world-bootstrap
    image: mysql:8.4
    networks: [ac-network]
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Yu'lon .env is missing}
    volumes:
      - ./apps/coa-world:/src/apps/coa-world:ro:z
      - ./data/coa-world:/src/data/coa-world:ro:z
      # `baseline.json`'s `coveredMigrations` hash every migration the baseline
      # already carries, and `world_data.py` reads those files under `ROOT`
      # (`/src`) before it loads a table: the core's `data/sql/updates/...` (80
      # files at the pin) and `modules/mod-ascension/data/sql/...` (2). Without
      # them the bootstrap dies on the first one with `[Errno 2] No such file or
      # directory` (live proof, yulon-ubuntu2 2026-10-28). Read-only and narrow:
      # the SQL the checksum pass needs, nothing the load writes.
      - ./data/sql:/src/data/sql:ro:z
      - ./modules/mod-ascension:/src/modules/mod-ascension:ro:z
    depends_on:
      coa-database:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    # T812 C5: the world bootstrap. The base data of `acore_world` is not an
    # import of SQL updates but a versioned baseline laid by
    # `apps/coa-world/world_data.py` out of the core checkout (`./apps/coa-world`
    # is that checkout's `apps/coa-world`, `./data/coa-world` its versioned
    # `data/coa-world`), so it runs here, in the image's own mysql:8.4, before
    # the db-import one-shot. The checkout's `ROOT` is `parents[2]` of that
    # script, i.e. `/src` here. The database's charset and collation are the
    # core's own default (`DBUpdater::Create()` on the pin, `DBUpdater.cpp`:
    # `DEFAULT CHARACTER SET UTF8MB4 COLLATE utf8mb4_general_ci`). The
    # password rides the compose `.env` variable into the mysql option file
    # only: never in argv, never in a printed command. Every `$` is doubled
    # for compose (`$$` renders one `$` for the shell that runs this).
    command:
      - |
        set -eu; umask 077
        printf '[client]\nuser=root\nhost=coa-database\npassword=%s\n' "$$DB_ROOT_PASSWORD" > /tmp/w.cnf
        chmod 600 /tmp/w.cnf
        q() { mysql --defaults-file=/tmp/w.cnf -N -B -e "$$1"; }
        q "CREATE DATABASE IF NOT EXISTS acore_world DEFAULT CHARACTER SET UTF8MB4 COLLATE utf8mb4_general_ci"
        if [ "$$(q "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='acore_world' AND TABLE_NAME='version'")" = 1 ]; then
          echo "yulon: the CoA world is already loaded"
          exit 0
        fi
        if [ "$$(q "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='acore_world'")" != 0 ]; then
          echo "yulon: an interrupted CoA world load was found; loading it again"
          q "DROP DATABASE acore_world"
          q "CREATE DATABASE IF NOT EXISTS acore_world DEFAULT CHARACTER SET UTF8MB4 COLLATE utf8mb4_general_ci"
        fi
        microdnf install -y python3.11 && microdnf clean all
        python3.11 /src/apps/coa-world/world_data.py bootstrap --defaults-file /tmp/w.cnf --database acore_world

networks:
  ac-network:

volumes:
  db-data:
