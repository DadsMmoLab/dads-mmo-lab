name: yulon-wow-wotlk-243c46e3
services:
  ac-authserver:
    container_name: ac-authserver
    depends_on:
      ac-database:
        condition: service_healthy
        required: true
      ac-db-import:
        condition: service_completed_successfully
        required: true
    environment:
      AC_LOGIN_DATABASE_INFO: ac-database;3306;root;password;acore_auth
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_TEMP_DIR: /azerothcore/env/dist/temp
    image: yulon.local/ac-wotlk-authserver:native-243c46e3
    networks:
      ac-network: null
    ports:
      - mode: ingress
        target: 3724
        published: "3724"
        protocol: tcp
    restart: unless-stopped
    tty: true
    volumes:
      - type: bind
        source: /home/pk/wowserver/env/dist/etc
        target: /azerothcore/env/dist/etc
        bind:
          create_host_path: true
      - type: bind
        source: /home/pk/wowserver/env/dist/logs
        target: /azerothcore/env/dist/logs
        bind:
          create_host_path: true
  ac-client-data-init:
    command:
      - |
        set -eu
        data=/azerothcore/env/dist/data
        fns=/azerothcore/apps/installer/includes/functions.sh
        ver=$$(sed -n 's/^[[:space:]]*local VERSION=//p' "$$fns" 2>/dev/null | head -1 | tr -d "\"' ")
        case "$${ver:-}" in
          v[0-9]*) ;;
          *)
            echo "yulon: cannot read client-data VERSION from $$fns — using upstream downloader"
            . "$$fns"
            inst_download_client_data
            exit $$?
            ;;
        esac
        mkdir -p "$$data"
        if [ -f "$$data/data-version" ] && grep -qx "INSTALLED_VERSION=$$ver" "$$data/data-version"; then
          echo "yulon: client data $$ver already installed"
          exit 0
        fi
        # Version-keyed name: a partial left by an OLDER version must never be
        # resumed into a newer one — that would splice two archives together.
        zip="$$data/data-$$ver.zip"
        retry_all=--retry-all-errors
        curl --help all 2>/dev/null | grep -q -- --retry-all-errors || retry_all=
        echo "yulon: downloading client data $$ver (resumable)"
        if ! curl -L --fail --retry 30 --retry-delay 10 $$retry_all --continue-at - \
             -o "$$zip" "https://github.com/wowgaming/client-data/releases/download/$$ver/data.zip"; then
          # A COMPLETE file makes the server answer 416, which --fail reports as
          # an error. "Already finished" must not read as "failed".
          echo "yulon: fetch returned non-zero — testing whether the archive is complete"
          unzip -t "$$zip" >/dev/null 2>&1 || { echo "yulon: client-data download FAILED"; exit 1; }
        fi
        # Refuse to extract a truncated archive: a half-unzipped data dir boots
        # a silently wrong server, which every check we have would call healthy.
        unzip -t "$$zip" >/dev/null
        echo "yulon: extracting client data $$ver"
        unzip -q -o "$$zip" -d "$$data/"
        rm -f "$$zip"
        echo "INSTALLED_VERSION=$$ver" > "$$data/data-version"
        echo "yulon: client data $$ver installed"
    container_name: ac-client-data-init
    entrypoint:
      - /bin/bash
      - -c
    image: yulon.local/ac-wotlk-client-data:native-243c46e3
    networks:
      default: null
    volumes:
      - type: volume
        source: client-data
        target: /azerothcore/env/dist/data
        volume: {}
  ac-database:
    container_name: ac-database
    environment:
      MYSQL_ROOT_PASSWORD: password
    healthcheck:
      test:
        - CMD-SHELL
        - /usr/bin/mysql -h ac-database --protocol=TCP --user=root --password=$$MYSQL_ROOT_PASSWORD --execute "SHOW DATABASES;"
      timeout: 10s
      interval: 5s
      retries: 40
    image: mysql:8.4
    networks:
      ac-network: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 3306
        published: "3306"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: db-data
        target: /var/lib/mysql
        volume: {}
  ac-db-import:
    container_name: ac-db-import
    depends_on:
      ac-database:
        condition: service_healthy
        required: true
    environment:
      AC_CHARACTER_DATABASE_INFO: ac-database;3306;root;password;acore_characters
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGIN_DATABASE_INFO: ac-database;3306;root;password;acore_auth
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_PLAYERBOTS_DATABASE_INFO: ac-database;3306;root;password;acore_playerbots
      AC_WORLD_DATABASE_INFO: ac-database;3306;root;password;acore_world
    image: yulon.local/ac-wotlk-db-import:native-243c46e3
    networks:
      ac-network: null
    volumes:
      - type: bind
        source: /home/pk/wowserver/env/dist/etc
        target: /azerothcore/env/dist/etc
        bind:
          create_host_path: true
      - type: bind
        source: /home/pk/wowserver/env/dist/logs
        target: /azerothcore/env/dist/logs
        bind:
          create_host_path: true
      - type: bind
        source: /home/pk/wowserver/modules
        target: /azerothcore/modules
        bind:
          create_host_path: true
  ac-worldserver:
    container_name: ac-worldserver
    depends_on:
      ac-client-data-init:
        condition: service_completed_successfully
        required: true
      ac-database:
        condition: service_healthy
        required: true
      ac-db-import:
        condition: service_completed_successfully
        required: true
    environment:
      AC_AI_PLAYERBOT_MAX_RANDOM_BOTS: "500"
      AC_AI_PLAYERBOT_MIN_RANDOM_BOTS: "500"
      AC_AI_PLAYERBOT_RANDOM_BOT_AUTOLOGIN: "1"
      AC_CHARACTER_DATABASE_INFO: ac-database;3306;root;password;acore_characters
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGIN_DATABASE_INFO: ac-database;3306;root;password;acore_auth
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_PLAYERBOTS_DATABASE_INFO: ac-database;3306;root;password;acore_playerbots
      AC_PLAYERBOTS_UPDATES_ENABLE_DATABASES: "1"
      AC_WORLD_DATABASE_INFO: ac-database;3306;root;password;acore_world
    image: yulon.local/ac-wotlk-worldserver:native-243c46e3
    networks:
      ac-network: null
    ports:
      - mode: ingress
        target: 8085
        published: "8085"
        protocol: tcp
      - mode: ingress
        host_ip: 127.0.0.1
        target: 7878
        published: "7878"
        protocol: tcp
    restart: unless-stopped
    stdin_open: true
    stop_grace_period: 5m0s
    tty: true
    volumes:
      - type: bind
        source: /home/pk/wowserver/env/dist/etc
        target: /azerothcore/env/dist/etc
        bind:
          create_host_path: true
      - type: bind
        source: /home/pk/wowserver/env/dist/logs
        target: /azerothcore/env/dist/logs
        bind:
          create_host_path: true
      - type: volume
        source: client-data
        target: /azerothcore/env/dist/data
        read_only: true
        volume: {}
      - type: bind
        source: /home/pk/wowserver/modules
        target: /azerothcore/modules
        bind:
          create_host_path: true
networks:
  ac-network:
    name: yulon-wow-wotlk-243c46e3_ac-network
  default:
    name: yulon-wow-wotlk-243c46e3_default
volumes:
  client-data:
    name: yulon-wow-wotlk-243c46e3_client-data
  db-data:
    name: yulon-wow-wotlk-243c46e3_db-data
